services:
  - type: web
    name: terraingrid-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STAC_API_URL
        value: https://earth-search.aws.element84.com/v1/search
      - key: CORS_ORIGINS
        sync: false
      - key: SENTINEL_HUB_CLIENT_ID
        sync: false
      - key: SENTINEL_HUB_CLIENT_SECRET
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_VLM_MODEL
        value: qwen2.5vl:7b
