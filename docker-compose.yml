services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8787:8787"
    volumes:
      - ./backend/static:/app/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
